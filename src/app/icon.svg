<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mazorca de cacao">
  <defs>
    <!-- Cuerpo: sombreado cilíndrico de una mazorca madura -->
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e2a0d"/>
      <stop offset="0.18" stop-color="#b4561c"/>
      <stop offset="0.42" stop-color="#f0a93e"/>
      <stop offset="0.55" stop-color="#f7c25a"/>
      <stop offset="0.78" stop-color="#c76a20"/>
      <stop offset="1" stop-color="#5e230b"/>
    </linearGradient>
    <!-- Oscurece la punta y la base -->
    <linearGradient id="profundidad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d1606" stop-opacity="0.35"/>
      <stop offset="0.2" stop-color="#3d1606" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#3d1606" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d1606" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Tinte rojizo de madurez en un costado -->
    <radialGradient id="rubor" cx="0.72" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#a3261a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a3261a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoja" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1f4d29"/>
      <stop offset="0.55" stop-color="#3f7d3a"/>
      <stop offset="1" stop-color="#7fae48"/>
    </linearGradient>
    <linearGradient id="tallo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2413"/>
      <stop offset="0.5" stop-color="#7a5230"/>
      <stop offset="1" stop-color="#3b2413"/>
    </linearGradient>
    <clipPath id="silueta">
      <path d="M32 11c9.4 0 14.3 7.9 14.6 18.6C47 41.4 40.9 53 32 61c-8.9-8-15-19.6-14.6-31.4C17.7 18.9 22.6 11 32 11z"/>
    </clipPath>
  </defs>

  <g transform="translate(-4.5 0.5) rotate(24 32 36)">
    <!-- Hoja detrás del pedúnculo -->
    <path d="M33 8.5C36.6 3 44.4 1 51.4 4.2 47.9 10.8 39.8 12.5 33 8.5z" fill="url(#hoja)"/>
    <path d="M33.4 8.4C39 6.6 44.6 5.2 50.4 4.5" fill="none" stroke="#173d20" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
    <path d="M38.4 7.1 40.2 4.4M42.6 6 44.6 3.4M46.6 5.1 48.2 3.2M40.8 6.5 42.8 8.9M45 5.5 47 7.7" fill="none" stroke="#173d20" stroke-width="0.45" stroke-linecap="round" opacity="0.5"/>

    <!-- Pedúnculo -->
    <path d="M30.4 12.2c-.4-3.6.4-6.4 2.6-8.4l1.7 1.1c-1.6 1.7-2.1 4-1.4 7.3z" fill="url(#tallo)"/>

    <!-- Cuerpo de la mazorca -->
    <g clip-path="url(#silueta)">
      <rect x="16" y="10" width="32" height="52" fill="url(#cuerpo)"/>
      <rect x="16" y="10" width="32" height="52" fill="url(#rubor)"/>
      <rect x="16" y="10" width="32" height="52" fill="url(#profundidad)"/>

      <!-- Surcos: sombra del canal y luz del lomo para dar relieve -->
      <g fill="none" stroke-linecap="round">
        <g stroke="#5a1f08" stroke-width="1.5" opacity="0.55">
          <path d="M32 11.5C32 28 32 45 32 60.5"/>
          <path d="M26.6 12.4C23.6 22 23.2 40 30.2 59.5"/>
          <path d="M37.4 12.4C40.4 22 40.8 40 33.8 59.5"/>
          <path d="M21.6 15.6C18.9 26 19.6 41.5 27.6 56.4"/>
          <path d="M42.4 15.6C45.1 26 44.4 41.5 36.4 56.4"/>
        </g>
        <g stroke="#ffe2a0" stroke-width="0.8" opacity="0.4">
          <path d="M29.3 12C28.7 28 28.8 45 31 60"/>
          <path d="M34.7 12C35.3 28 35.2 45 33 60"/>
          <path d="M24 13.6C21.1 24 21.3 40.5 28.8 58"/>
          <path d="M40 13.6C42.9 24 42.7 40.5 35.2 58"/>
        </g>
      </g>

      <!-- Textura rugosa en el lomo central -->
      <g fill="#fff0c2" opacity="0.28">
        <circle cx="29.6" cy="22" r="0.6"/>
        <circle cx="34.4" cy="26" r="0.55"/>
        <circle cx="29.8" cy="31" r="0.5"/>
        <circle cx="34.2" cy="35.5" r="0.55"/>
        <circle cx="30.4" cy="41" r="0.5"/>
        <circle cx="33.6" cy="46" r="0.45"/>
      </g>

      <!-- Brillo especular -->
      <ellipse cx="27.2" cy="25" rx="3.4" ry="9" fill="url(#brillo)" transform="rotate(-8 27.2 25)"/>
    </g>

    <!-- Contorno suave -->
    <path d="M32 11c9.4 0 14.3 7.9 14.6 18.6C47 41.4 40.9 53 32 61c-8.9-8-15-19.6-14.6-31.4C17.7 18.9 22.6 11 32 11z" fill="none" stroke="#4a1a07" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
